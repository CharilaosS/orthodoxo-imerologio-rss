name: Καθημερινό post

on:
  schedule:
    # Ποτέ στο :00 — το GitHub καθυστερεί/πετάει scheduled runs στην αρχή της ώρας (20/11 δεν έτρεξε).
    # Δύο runs: το 2ο είναι backup· το generate.py αντικαθιστά το post της ίδιας μέρας.
    - cron: "23 2 * * *"   # 04:23 χειμώνα / 05:23 καλοκαίρι (ώρα Ελλάδας)
    - cron: "47 4 * * *"   # 06:47 χειμώνα / 07:47 καλοκαίρι — backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python generate.py
      - name: Commit ιστορικού
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "Post $(TZ=Europe/Athens date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
